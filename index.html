<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculadora">
        <h1>Calculadora</h1>

        <input type="number" id="numero1" placeholder="Digite o primeiro número">

        <input type="number" id="numero2" placeholder="Digite o segundo número">

        <div class="botoes">
            <button onclick="adicionar()">Adição (+)</button>
            <button onclick="subtrair()">Subtração (-)</button>
        </div>

        <div id="resultado">
            Resultado: 
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
